[project]
name = "heron"
version = "0.2.0"
description = "Phishing email triage"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[build-system]
requires = ["hatchling >= 1.27"]
build-backend = "hatchling.build"

[project.scripts]
heron = "heron.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/heron"]